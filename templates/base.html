{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    {% csrf_token %}
    <meta name="csrf-token" content="{{ csrf_token }}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agro-Mind</title>

    <link rel="icon" type="image/x-icon" href="{% static 'img/favicon.ico' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static "css/base.css" %}">

    <script src="{% static "js/base.js" %}" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>

    {% block css %}{% endblock %}
    {% block js %}{% endblock %}
</head>
<body class="bg-light">
    {% block header %}
        <nav style="font-size: 18px;" class="navbar navbar-expand-lg navbar-dark bg-success shadow-sm">
            <div class="container">
                <a class="navbar-brand fw-bold" href="{% url "todolist" %}">Agro‑Mind</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="mainNavbar">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="{% url 'todolist' %}">Задачи</a></li>
                        <li class="nav-item"><a class="nav-link monitoring" href="{% url 'monitoring' %}">Мониторинг</a></li>
                        <li class="nav-item"><a class="nav-link" href="{% url 'guide' %}">Справочник</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    {% endblock %}

    <main class="container py-4">
        <h1 class="mb-4">
            {% block title %}{% endblock %}
        </h1>

        {% block content %}{% endblock %}
    </main>

    {% block footer %}{% endblock %}
</body>
</html>
