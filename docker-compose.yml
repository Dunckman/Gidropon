services:
  web:
    build: .
    container_name: gidropon-web
    env_file:
      - .env
    environment:
      GIDROPON_DB_HOST: db
      GIDROPON_DB_PORT: 5432
      CELERY_BROKER_URL: amqp://dunckman:agro-mind@rabbitmq:5672//
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
    depends_on:
      - db
      - rabbitmq
    volumes:
      - static_volume:/app/staticfiles
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000
    restart: unless-stopped
    expose:
      - "8000"
  db:
    image: postgres:18
    container_name: gidropon-db
    environment:
      POSTGRES_DB: gidropon
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: TAPs\8G:WIqn
    ports:
      - "5437:5432"
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql
  rabbitmq:
    image: rabbitmq:3-management
    container_name: gidropon-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: rabbit
      RABBITMQ_DEFAULT_PASS: TR7cSOec=B
      GIDROPON_DB_HOST: db
      GIDROPON_DB_PORT: 5432
    restart: unless-stopped
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
  celery_worker:
    build: .
    container_name: gidropon-celery-worker
    command: celery -A config worker -l info --concurrency=10
    env_file:
      - .env
    environment:
      GIDROPON_DB_HOST: db
      GIDROPON_DB_PORT: 5432
      CELERY_BROKER_URL: amqp://rabbit:TR7cSOec=B@rabbitmq:5672//
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
    depends_on:
      - rabbitmq
      - db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
  celery_beat:
    build: .
    container_name: gidropon-celery-beat
    command: celery -A config beat -l info
    env_file:
      - .env
    environment:
      - GIDROPON_DB_HOST=db
      - GIDROPON_DB_PORT=5432
      - CELERY_BROKER_URL=amqp://rabbit:TR7cSOec=B@rabbitmq:5672//
    depends_on:
      - rabbitmq
      - db
    restart: unless-stopped
  nginx:
    image: nginx:latest
    ports:
      - "127.0.0.1:5267:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles
    depends_on:
      - web
    restart: unless-stopped
  ollama:
    image: ollama/ollama:latest
    container_name: gidropon-ollama
    expose:
      - "11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    restart: unless-stopped

volumes:
  pgdata:
  rabbitmq_data:
  static_volume:
  ollama_data:
