{% extends "base.html" %}
{% load static %}

{% block js %}
    <script src="{% static "monitoring/js/monitoring.js" %}" defer></script>
    <script src="{% static "users/js/celery.js" %}" defer></script>
{% endblock %}

{% block header %}{% endblock %}
{% block title %}{% endblock %}

{% block content %}
    <div class="d-flex flex-column justify-content-center align-items-center" style="min-height: 70vh;">
        <div class="card shadow-sm border-0" style="max-width: 640px;">
            <div class="card-body text-center">
                <div class="mb-3" style="font-size: 48px;">🥳</div>
                <h3 class="mb-3">Всё в порядке</h3>
                <p class="text-muted">
                    Неустранённых аварий нет!!!
                </p>
            </div>
        </div>

        <div class="mt-3">
            <a class="btn btn-success" href="{% url 'todolist' %}">Перейти задачам</a>

            <button style="width: 110px;"
                    class="btn btn-primary check-new"
                    type="button"
                    data-url="{% url 'check_new' %}">Проверить</button>
            <button style="width: 38px; height: 38px; padding: 0; line-height: 1;"
                    class="btn btn-danger stop-check-new d-none"
                    type="button"
                    title="Остановить проверку"
                    data-url="{% url 'cancel_check_new' task_id=0 %}">🗙</button>
        </div>
    </div>
{% endblock %}

{% block footer %}{% endblock %}
