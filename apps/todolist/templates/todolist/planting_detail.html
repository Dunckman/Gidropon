<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gidropon</title>
</head>
<body>
    <h3>Дата посадки: {{ planting.datetime|date:"H:i j.m.Y" }}</h3>

    <p>Статус: {{ planting.get_status_display }}</p>

    <p>Посаженное растение: {{ plant.title }}

        <a href="{% url 'location_detail' location_id=location.location_id %}">Подробнее</a></p>

    <a href="{% url 'todolist' %}">Перейти к списку задач</a>

</body>
