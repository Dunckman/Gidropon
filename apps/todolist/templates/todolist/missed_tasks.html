<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gidropon</title>
    <!-- CSRF token для AJAX -->
    {% csrf_token %}
    <style>
        .task-row {
            display: flex;
            gap: 15px;
            align-items: center;
            padding: 10px 0;
            {#border-bottom: 1px solid #eee;#}
        }
    </style>
</head>
<body>
    <h3>Пропущенные задачи:</h3>

    <div id="tasks-container">
        {% if not tasks %}
            <p>Пропущенных задач нет.</p>
        {% else %}
            {% for task in tasks %}
                <div class="task-row" id="task-row-{{ task.task_id }}">
                    <input type="checkbox"
                           class="task-checkbox"
                           data-task-id="{{ task.task_id }}"
                    >
                    <label>{{ task.show_as_missed }}</label>
                    <a href="{% url 'task_detail' task_id=task.task_id %}">Подробнее</a>
                </div>
            {% endfor %}
        {% endif %}
    </div>

    <a href="{% url 'todolist' %}">Вернуться к основным задачам</a>

    <script>
        const csrftoken = document.querySelector('[name=csrfmiddlewaretoken]').value;

        document.querySelectorAll('.task-checkbox').forEach(checkbox => {
            checkbox.addEventListener('change', function() {
                const taskId = this.dataset.taskId;
                const row = document.getElementById(`task-row-${taskId}`);

                if (this.checked) {
                    // Отправляем AJAX-запрос
                    fetch(`{% url 'mark_task_done' task_id=0 %}`.replace('/0/', `/${taskId}/`), {
                        method: 'POST',
                        headers: {
                            'X-CSRFToken': csrftoken,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({})
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            // Сразу удаляем строку
                            row.remove();
                            const container = document.getElementById('tasks-container');
                            if (container.querySelectorAll('.task-row').length === 0) {
                                container.innerHTML = '<p>На сегодня задач нет.</p>';
                            }
                        } else {
                            // Ошибка — снимаем галочку
                            this.checked = false;
                            alert('Не удалось обновить статус задачи.');
                        }
                    })
                    .catch(error => {
                        console.error('Ошибка:', error);
                        this.checked = false;
                        alert('Ошибка подключения к серверу.');
                    });
                }
            });
        });

        document.querySelector('.show_empty').addEventListener('change', function(){

        });
    </script>
</body>
</html>
